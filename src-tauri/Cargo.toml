[package]
name = "primoria-dashboard"
version = "0.1.0"
description = "Primoria Dashboard"
authors = []
edition = "2021"

[lib]
name = "primoria_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "primoria-dashboard"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls", "cookies", "query", "form"] }
reqwest_cookie_store = "0.10.0"
cookie_store = "0.22.1"
